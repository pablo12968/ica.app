name: frontend
description: Ice Cream App, catálogo y pedidos para móviles.
publish_to: 'none'
version: 1.1.0+2
environment:
  sdk: ^3.13.2
dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/OFL.txt
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
